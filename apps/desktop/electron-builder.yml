appId: com.leadforge.desktop

productName: "LeadForge OS"

npmRebuild: false

directories:
  output: dist
  buildResources: resources

files:
  - out/**
  - package.json
  - "!src"
  - "!electron.vite.config.*"
  - "!**/*.map"

asar: true

compression: maximum

artifactName: "${productName}-${version}-${os}-${arch}.${ext}"

extraMetadata:
  main: out/main/index.js

win:
  target:
    - nsis
  icon: resources/icon.png

nsis:
  oneClick: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: "LeadForge OS"
  runAfterFinish: true

publish:
  provider: github
  owner: kjxcodez
  repo: leadforge-os