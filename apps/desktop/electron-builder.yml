appId: com.leadforge.os

productName: "LeadForge OS"

npmRebuild: true

directories:
  output: dist
  buildResources: resources

files:
  - out/**
  - package.json
  - "!src"
  - "!electron.vite.config.*"
  - "!**/*.map"

asar: true

compression: maximum

artifactName: "${productName}-Setup-${version}.${ext}"

extraMetadata:
  main: out/main/index.js

# ─── Code Signing ────────────────────────────────────────────────────────────
# Only sign when a code signing certificate is explicitly provided via env vars.
# Without CSC_LINK set, electron-builder will skip signing automatically.
forceCodeSigning: false

# ─── Windows (only supported release platform) ───────────────────────────────

win:
  target:
    - nsis
  icon: resources/icon.png
  sign: null
  signAndEditExecutable: false
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: "LeadForge OS"
  runAfterFinish: true
  # Installer display name shown in Add/Remove Programs
  displayLanguageSelector: false

publish:
  provider: github
  owner: kjxcodez
  repo: leadforge-os